[project]
name = "mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline for bank loan application risk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cookiecutter>=2.7.1",
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "hydra-core>=1.3.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "pandera>=0.32.1",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.2",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
