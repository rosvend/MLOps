[project]
name = "mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline for bank loan application risk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cookiecutter>=2.7.1",
    "dvc>=3.67.1",
    "evidently>=0.7.11",
    "fastapi>=0.141.1",
    "feast>=0.66.0",
    "hydra-core>=1.3.5",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "optuna>=5.0.0",
    "pandas>=2.3.3",
    "pandera>=0.32.1",
    "plotly>=5.10.0,<6",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[dependency-groups]
# Only what scoring a logistic regression needs. The boosters, MLflow and Feast's dask
# stack train and register models; they have no part in answering a request.
serving = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "joblib>=1.5.3",
    "scikit-learn>=1.9.0",
    "pydantic>=2.13.4",
    "pandas>=2.3.3",
    "numpy>=2.5.2",
    "pyyaml>=6.0.2",
    "httpx>=0.28.1",
    # Evidently is heavy relative to the rest of this group - it is here because the
    # live /monitoring/run-drift-check endpoint runs it in-process. Everything else
    # this group excludes (MLflow, XGBoost, LightGBM, Feast) is training-only; this
    # is not - it is a genuine capability of the deployed service.
    "evidently>=0.7.11,<0.7.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
