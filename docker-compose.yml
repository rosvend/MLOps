services:
  scoring-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: credito-scoring-api:local
    container_name: credito-scoring-api
    ports:
      - "8000:8000"
    environment:
      SERVING_MODEL_PATH: /app/models/champion.joblib
      SERVING_META_PATH: /app/models/champion.meta.json
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
