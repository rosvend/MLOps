services:
  scoring-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: credito-scoring-api:local
    container_name: credito-scoring-api
    ports:
      # Loopback only: this compose file is for local batch scoring and the endpoint
      # has no authentication. Exposing it on every interface would publish an
      # unauthenticated scoring service to the network.
      - "127.0.0.1:8000:8000"
    environment:
      SERVING_MODEL_PATH: /app/models/champion.joblib
      SERVING_META_PATH: /app/models/champion.meta.json
    volumes:
      # The one write path the container needs: the SQLite request log and live drift
      # dashboards. Everything else stays read-only, unmounted, exactly as stage 8 left it.
      - ./data/monitoring:/app/data/monitoring
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
