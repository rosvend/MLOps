# Scorecard measured once on the 10 763-loan dataset in notebooks/eda.ipynb.
# Cut-points are frozen on purpose: recomputing them per batch would make one
# application score differently depending on who else was scored alongside it.
#
# Every weight below was generated by:
#     points = round((band_default_rate / base_rate - 1) * lift_multiplier)
# so a band that doubles the portfolio rate costs +4 and one that halves it pays -2.
# The rate behind each number is tabulated in docs/heuristic-model.md.

threshold: 4
deciles: 10
decile_minimo: 200

base_rate: 0.0475
lift_multiplier: 4

cut_points:
  puntaje_bureau_terciles: [770, 813]
  huella_bandas: [3, 6]
  brecha_ingreso_cuartiles: [1.081, 1.807, 3.594]
  capital_cuartil_alto: 3084840
  plazo_largo_meses: 13
  edad_joven: 36

points:
  puntaje_bureau:
    bajo: 2
    medio: -1
    alto: -2
  puntaje_bureau_ausente: 2
  huella:
    "0-3": -1
    "4-6": 0
    "7+": 2
  rango_edad:
    "18-25": 3
    "26-35": 1
    "36-45": -1
    "46-55": -1
    "56-65": 0
    "66+": -1
  rango_edad_ausente: 2
  independiente_joven: 3
  brecha_ingreso: [-1, -1, 0, 1]
  tendencia:
    Decreciente: 1
    Estable: 0
    Creciente: -1
  monto_alto_plazo_largo: 5
  ingreso_bureau_ausente: 1
